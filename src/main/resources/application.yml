server:
  port: 8081
management:
  endpoints:
    web:
      exposure:
        include: prometheus,health,info
  endpoint:
    prometheus:
      enabled: true
    health:
      show-details: always
spring:
  application:
    name: g1test
  # Nacos配置
  cloud:
    nacos:
      # 配置中心
      config:
        server-addr: localhost:8848
        file-extension: yaml
        refresh-enabled: true
        import-check:
          enabled: false
        # 共享配置
        shared-configs:
          - data-id: g1test.yaml
            group: DEFAULT_GROUP
            refresh: true
        # 扩展配置
        extension-configs:
            - data-id: g1test.yaml
              group: DEFAULT_GROUP
              refresh: true
      # 服务发现
      discovery:
        server-addr: localhost:8848
  config:
    import: optional:nacos:g1test.yaml
  
  # ShardingSphere-JDBC 读写分离配置
  shardingsphere:
    datasource:
      names: master,slave
      # 主库配置
      master:
        type: com.zaxxer.hikari.HikariDataSource
        driver-class-name: com.mysql.cj.jdbc.Driver
        jdbc-url: jdbc:mysql://localhost:13306/testdb?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
        username: root
        password: root
        # 连接池配置
        minimum-idle: 5
        maximum-pool-size: 20
        connection-timeout: 30000
        idle-timeout: 600000
        max-lifetime: 1800000
      # 从库配置
      slave:
        type: com.zaxxer.hikari.HikariDataSource
        driver-class-name: com.mysql.cj.jdbc.Driver
        jdbc-url: jdbc:mysql://localhost:13307/testdb?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
        username: root
        password: root
        # 连接池配置
        minimum-idle: 5
        maximum-pool-size: 20
        connection-timeout: 30000
        idle-timeout: 600000
        max-lifetime: 1800000
    
    # 读写分离配置
    rules:
      readwrite-splitting:
        data-sources:
          readwrite_ds:
            type: Static
            props:
              write-data-source-name: master
              read-data-source-names: slave
            load-balancer-name: round_robin
        load-balancers:
          round_robin:
            type: ROUND_ROBIN
    
    # 属性配置
    props:
      sql-show: true
      
  # 默认数据源配置（防止启动错误）
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:13306/testdb?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: root

# MyBatis Plus配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 日志配置
logging:
  level:
    com.huf.g1test: debug
    # ShardingSphere SQL路由日志
    org.apache.shardingsphere: debug
    org.apache.shardingsphere.sharding: debug
    org.apache.shardingsphere.readwritesplitting: debug
    org.apache.shardingsphere.driver.jdbc.core: debug