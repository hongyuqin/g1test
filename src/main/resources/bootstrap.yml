server:
  port: 8081
management:
  endpoints:
    web:
      exposure:
        include: prometheus,health,info
  endpoint:
    prometheus:
      enabled: true
spring:
  config:
    import: optional:nacos:g1test.yaml?group=DEFAULT_GROUP&refresh=true
  application:
    name: g1test
  cloud:
    nacos:
      config:
        server-addr: 127.0.0.1:8848
        # 配置自动刷新（关键！）
        extension-configs: # 扩展配置
          - data-id: g1test.yaml
            group: DEFAULT_GROUP
            refresh: true
      discovery:
        server-addr: 127.0.0.1:8848