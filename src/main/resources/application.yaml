server:
  port: 8083
spring:
  application:
    name: G1Test
  mvc:
    validation:
      enabled: true
  datasource:
    url: jdbc:mysql://localhost:3306/test
    driver-class-name: com.mysql.jdbc.Driver
    username: root
    password: root
  redis:
    cluster:
      nodes: 127.0.0.1:7001,127.0.0.1:7002,127.0.0.1:7003,127.0.0.1:7004,127.0.0.1:7005,127.0.0.1:7006
      max-redirects: 3  # 最大重定向次数
    timeout: 5000
    lettuce: # 或 jedis（根据实际客户端）
      pool:
        max-active: 16
        max-idle: 8
        min-idle: 4

logging:
  level:
    org:
      apache:
        kafka: INFO